plugins {
    id 'com.android.application'
}

android {
    namespace 'net.nekomami.cubej1'
    compileSdk 34

    // Signing has to be stable or Android refuses to update the previous
    // install with "package conflict". With no key chosen, Gradle makes a
    // debug one on whatever machine builds, and CI gets a fresh empty
    // machine every run, so no two builds could ever replace each other.
    //
    // The debug keystore is therefore committed, with the conventional
    // androiddebugkey/android credentials. That makes it usable by anyone
    // who takes the file, which is acceptable here and nowhere near a
    // release key: Google Play rejects anything signed this way, and the
    // app is only ever sideloaded, so using the key still means talking
    // the owner into installing an APK by hand.
    //
    // A real release key can be added later without touching this: drop it
    // in the repository secrets and the release build picks it up.
    def releaseStore = System.getenv("RELEASE_KEYSTORE")
    def haveReleaseKey = releaseStore != null && !releaseStore.isEmpty() && file(releaseStore).exists()

    signingConfigs {
        getByName("debug") {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
            // v1 alongside v2/v3 so `keytool -printcert -jarfile` can read
            // the signer out of a finished APK; that is the only way to tell
            // from outside which key a download actually carries.
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
        if (haveReleaseKey) {
            create("release") {
                storeFile file(releaseStore)
                storePassword System.getenv("RELEASE_KEYSTORE_PASSWORD")
                keyAlias System.getenv("RELEASE_KEY_ALIAS") ?: "release"
                keyPassword System.getenv("RELEASE_KEY_PASSWORD")
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    defaultConfig {
        applicationId "net.nekomami.cubej1"
        minSdk 24
        targetSdk 34
        versionCode 7
        versionName "1.4"
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.getByName("debug")
        }
        release {
            minifyEnabled false
            // Falls back to the debug key rather than coming out unsigned,
            // because an unsigned APK simply refuses to install.
            signingConfig signingConfigs.getByName(haveReleaseKey ? "release" : "debug")
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// No dependencies on purpose. The whole app is one Activity around a WebView,
// so the framework classes are enough and the build stays quick and boring.
dependencies { }
