<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>履歴</title>
<style>
/* Same tokens as the Cube's dashboard, so moving between the two does not
   feel like moving between two apps. */
:root{
  color-scheme: light;
  --plane:#f9f9f7; --surface:#fcfcfb;
  --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --base:#c3c2b7;
  --s1:#2a78d6; --s1wash:rgba(42,120,214,.12);
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --plane:#0d0d0d; --surface:#1a1a19;
    --ink:#f2f2f0; --ink2:#a8a7a2; --muted:#7c7b76;
    --grid:#2b2b29; --base:#45443f;
    --s1:#5a9ce8; --s1wash:rgba(90,156,232,.16);
  }
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--plane); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  -webkit-text-size-adjust:100%;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 48px}
h1{font-size:19px;margin:4px 0 2px}
.sub{font-size:12px;color:var(--muted);margin-bottom:18px;line-height:1.6}
.card{background:var(--surface);border:1px solid var(--grid);border-radius:12px;padding:14px;margin-bottom:14px}
.card h2{font-size:14px;margin:0 0 12px}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:28px 8px;line-height:1.8}

.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}
.day{flex:0 0 auto;min-width:82px;background:var(--plane);border:1px solid var(--grid);
     border-radius:10px;padding:9px 10px;text-align:left;cursor:pointer;font:inherit;color:inherit}
.day.sel{border-color:var(--s1);background:var(--s1wash)}
.day .d{font-size:11px;color:var(--muted)}
.day .k{font-size:17px;font-weight:600;margin-top:3px;font-variant-numeric:tabular-nums}
.day .k small{font-size:10px;color:var(--muted);font-weight:500;margin-left:2px}
.day .partial{color:var(--muted);font-size:10px;margin-top:2px}

.head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.legend{font-size:11px;color:var(--muted);white-space:nowrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin:0 3px 0 8px;
          vertical-align:-1px;background:var(--s1);opacity:.35}
.legend u{display:inline-block;width:12px;height:2px;margin:0 3px 0 8px;
          vertical-align:3px;background:var(--s1)}
canvas{width:100%;height:172px;display:block}
.axis{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:6px}
.tot{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;
     padding-top:12px;border-top:1px solid var(--grid)}
.tot .lab{font-size:12px;color:var(--ink2)}
.tot .val{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.tot .val small{font-size:12px;color:var(--muted);font-weight:500;margin-left:3px}
.note{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.7}
footer{font-size:11px;color:var(--muted);text-align:center;line-height:1.8;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">

  <h1>履歴</h1>
  <div class="sub" id="status">読み込み中...</div>

  <div class="card">
    <h2>日ごと</h2>
    <div class="days" id="days"></div>
  </div>

  <div class="card" id="dayCard" hidden>
    <div class="head">
      <h2 id="dayTitle" style="margin:0">30分ごと</h2>
      <span class="legend"><i></i>30分平均<u></u>1分ごと</span>
    </div>
    <canvas id="chart"></canvas>
    <div class="axis"><span>0時</span><span>6時</span><span>12時</span><span>18時</span><span>24時</span></div>
    <div class="tot"><span class="lab">この日の合計</span><span class="val" id="dayTotal">--<small>kWh</small></span></div>
    <div class="note" id="note"></div>
  </div>

  <div class="card" id="emptyCard" hidden>
    <div class="empty">
      まだ履歴がありません。<br>
      家の Wi-Fi に入って「今すぐ同期」を実行してください。
    </div>
  </div>

  <footer id="foot"></footer>
</div>

<script>
function api(name, arg) {
  try {
    return JSON.parse(arg === undefined ? Meter[name]() : Meter[name](arg));
  } catch (e) {
    return null;
  }
}

function ago(ms) {
  if (!ms) return "まだ一度も同期していません";
  var s = Math.floor((Date.now() - ms) / 1000);
  if (s < 90) return "さきほど同期";
  if (s < 3600) return Math.floor(s / 60) + "分前に同期";
  if (s < 86400) return Math.floor(s / 3600) + "時間前に同期";
  return Math.floor(s / 86400) + "日前に同期";
}

function fmt(v, d) {
  if (v === null || v === undefined || isNaN(v)) return "--";
  return Number(v).toFixed(d === undefined ? 1 : d);
}

function css(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

var lastDays = [];
var selected = null;

/**
 * Both series on one axis in watts.
 *
 * A half-hour slot's kWh is the same quantity as instantaneous power, just
 * averaged: kWh per 30 min x 2000 is the mean watts over that slot. Plotting
 * the bars in watts is what makes the minute line sit honestly on top of
 * them instead of next to an unrelated scale.
 */
function draw(use, samples, midnight) {
  var c = document.getElementById("chart");
  var dpr = window.devicePixelRatio || 1;
  var W = Math.round(c.clientWidth * dpr);
  var H = Math.round(c.clientHeight * dpr);
  c.width = W; c.height = H;
  var ctx = c.getContext("2d");
  ctx.clearRect(0, 0, W, H);

  var pad = 6 * dpr;
  var plotH = H - pad * 2;

  var barW = use.map(function (v) { return v === null || v === undefined ? null : v * 2000; });
  var vals = barW.filter(function (v) { return v !== null; });
  var lineW = samples.map(function (s) { return s[1]; }).filter(function (v) { return v !== null; });
  var max = Math.max.apply(null, vals.concat(lineW).concat([1]));
  max = max * 1.12;

  function X(sec) { return (sec / 86400) * W; }
  function Y(w) { return pad + plotH - (w / max) * plotH; }

  ctx.strokeStyle = css("--grid");
  ctx.lineWidth = 1 * dpr;
  for (var g = 0; g <= 2; g++) {
    var y = pad + plotH * g / 2;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }

  // 30-minute averages, behind
  ctx.fillStyle = css("--s1");
  ctx.globalAlpha = 0.35;
  for (var i = 0; i < 48; i++) {
    if (barW[i] === null) continue;
    var x0 = X(i * 1800) + 0.5 * dpr;
    var x1 = X((i + 1) * 1800) - 0.5 * dpr;
    var y0 = Y(barW[i]);
    ctx.fillRect(x0, y0, Math.max(1, x1 - x0), pad + plotH - y0);
  }
  ctx.globalAlpha = 1;

  // Per-minute, in front. Broken into runs so a gap in the record shows as
  // a gap rather than a straight line across it.
  if (samples.length > 1) {
    ctx.strokeStyle = css("--s1");
    ctx.lineWidth = 1.6 * dpr;
    ctx.lineJoin = "round"; ctx.lineCap = "round";
    ctx.beginPath();
    var open = false, prev = null;
    for (var k = 0; k < samples.length; k++) {
      var ts = samples[k][0], w = samples[k][1];
      if (w === null || w === undefined) { open = false; continue; }
      var sec = ts - midnight;
      if (sec < 0 || sec > 86400) { open = false; continue; }
      if (open && prev !== null && sec - prev > 300) open = false; // >5 min gap
      if (!open) { ctx.moveTo(X(sec), Y(w)); open = true; }
      else { ctx.lineTo(X(sec), Y(w)); }
      prev = sec;
    }
    ctx.stroke();
  }

  ctx.fillStyle = css("--muted");
  ctx.font = (11 * dpr) + "px -apple-system, sans-serif";
  ctx.fillText(Math.round(max / 1.12) + " W", 4 * dpr, 13 * dpr);
}

function renderDays() {
  var box = document.getElementById("days");
  box.innerHTML = "";
  lastDays.forEach(function (d) {
    var b = document.createElement("button");
    b.className = "day" + (d.date === selected ? " sel" : "");
    b.innerHTML = '<div class="d">' + d.date.slice(5).replace("-", "/") + "</div>"
      + '<div class="k">' + fmt(d.total_kwh, 1) + "<small>kWh</small></div>"
      + (d.complete ? "" : '<div class="partial">欠けあり</div>');
    b.onclick = function () { select(d.date); };
    box.appendChild(b);
  });
}

function select(date) {
  selected = date;
  var d = api("day", date);
  var card = document.getElementById("dayCard");
  if (!d || !d.use_kwh) { card.hidden = true; return; }

  var mins = api("minutesForDate", date) || { samples: [] };
  var samples = mins.samples || [];

  var parts = date.split("-");
  var midnight = Math.floor(
    new Date(+parts[0], +parts[1] - 1, +parts[2], 0, 0, 0, 0).getTime() / 1000);

  card.hidden = false;
  draw(d.use_kwh, samples, midnight);

  var known = d.use_kwh.filter(function (v) { return v !== null; });
  var total = known.reduce(function (a, b) { return a + b; }, 0);
  document.getElementById("dayTitle").textContent = date;
  document.getElementById("dayTotal").innerHTML = fmt(total, 1) + "<small>kWh</small>";
  document.getElementById("note").textContent = samples.length
    ? "1分ごとの記録 " + samples.length + " 件"
    : "この日の1分ごとの記録はありません（Cube が保持する分だけ同期できます）";

  renderDays();
}

function load() {
  var st = api("status") || {};
  document.getElementById("status").textContent =
    ago(st.last_sync) + " ・ " + (st.days || 0) + "日分 / " + (st.minutes || 0) + "件";
  document.getElementById("foot").textContent =
    st.host ? "Cube " + st.host + " から取得" : "";

  var r = api("days", 60);
  lastDays = (r && r.days) || [];
  document.getElementById("emptyCard").hidden = lastDays.length > 0;
  renderDays();
  if (lastDays.length) select(lastDays[0].date);
}

window.addEventListener("resize", function () { if (selected) select(selected); });
load();
</script>
</body>
</html>
