<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>履歴</title>
<style>
/* Same tokens as the Cube's dashboard, so moving between the two does not
   feel like moving between two apps. */
:root{
  color-scheme: light;
  --plane:#f9f9f7; --surface:#fcfcfb;
  --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --base:#c3c2b7;
  --s1:#2a78d6; --s1wash:rgba(42,120,214,.12);
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --plane:#0d0d0d; --surface:#1a1a19;
    --ink:#f2f2f0; --ink2:#a8a7a2; --muted:#7c7b76;
    --grid:#2b2b29; --base:#45443f;
    --s1:#5a9ce8; --s1wash:rgba(90,156,232,.16);
  }
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--plane); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  -webkit-text-size-adjust:100%;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 48px}
h1{font-size:19px;margin:4px 0 2px}
.sub{font-size:12px;color:var(--muted);margin-bottom:18px;line-height:1.6}
.card{background:var(--surface);border:1px solid var(--grid);border-radius:12px;padding:14px;margin-bottom:14px}
.card h2{font-size:14px;margin:0 0 12px}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:28px 8px;line-height:1.8}

button{font:inherit;color:inherit}
.yearbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.yearbar .y{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.yearbar .y small{font-size:12px;color:var(--muted);font-weight:500;margin-left:8px}
.step{width:40px;height:34px;border:1px solid var(--grid);border-radius:9px;background:var(--plane);
      font-size:16px;cursor:pointer}
.step:disabled{opacity:.3;cursor:default}

/* Twelve months in two rows and a month as a calendar: the whole range is
   reachable without scrolling sideways through a strip of days. */
.months{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.mon{background:var(--plane);border:1px solid var(--grid);border-radius:9px;padding:6px 2px;
     cursor:pointer;text-align:center;min-width:0}
.mon:disabled{opacity:.35;cursor:default}
.mon .m{font-size:12px}
.mon .k{font-size:11px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums;
        white-space:nowrap;overflow:hidden}
.sel{border-color:var(--s1) !important;background:var(--s1wash) !important}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{font-size:10px;color:var(--muted);text-align:center;padding-bottom:2px}
.cell{border:1px solid var(--grid);border-radius:8px;background:var(--plane);padding:5px 1px 4px;
      text-align:center;cursor:pointer;min-width:0}
.cell:disabled{opacity:.35;cursor:default}
.cell.blank{visibility:hidden}
.cell .n{font-size:11px;color:var(--ink2)}
.cell .k{font-size:12px;font-weight:600;margin-top:1px;font-variant-numeric:tabular-nums;white-space:nowrap}
.cell .k.part{color:var(--muted);font-weight:500}

.csv{display:grid;grid-template-columns:auto 1fr 1fr;gap:8px;align-items:center}
.csv .lab{font-size:13px;color:var(--ink2);padding-right:4px}
.csv button{border:1px solid var(--grid);border-radius:9px;background:var(--plane);
            padding:9px 4px;font-size:13px;cursor:pointer}

.head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.legend{font-size:11px;color:var(--muted);white-space:nowrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin:0 3px 0 8px;
          vertical-align:-1px;background:var(--s1);opacity:.35}
.legend u{display:inline-block;width:12px;height:2px;margin:0 3px 0 8px;
          vertical-align:3px;background:var(--s1)}
canvas{width:100%;height:172px;display:block}
.axis{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:6px}
.tot{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;
     padding-top:12px;border-top:1px solid var(--grid)}
.tot .lab{font-size:12px;color:var(--ink2)}
.tot .val{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.tot .val small{font-size:12px;color:var(--muted);font-weight:500;margin-left:3px}
.note{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.7}
footer{font-size:11px;color:var(--muted);text-align:center;line-height:1.8;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">

  <h1>履歴</h1>
  <div class="sub" id="status">読み込み中...</div>

  <div class="card" id="pickCard" hidden>
    <div class="yearbar">
      <button class="step" id="prevYear" aria-label="前の年">‹</button>
      <span class="y" id="yearLabel"></span>
      <button class="step" id="nextYear" aria-label="次の年">›</button>
    </div>
    <div class="months" id="months"></div>
  </div>

  <div class="card" id="calCard" hidden>
    <div class="head">
      <h2 id="monthTitle" style="margin:0"></h2>
      <span class="legend" id="monthTotal"></span>
    </div>
    <div class="cal" id="cal"></div>
  </div>

  <div class="card" id="dayCard" hidden>
    <div class="head">
      <h2 id="dayTitle" style="margin:0">30分ごと</h2>
      <span class="legend"><i></i>30分平均<u></u>1分ごと</span>
    </div>
    <canvas id="chart"></canvas>
    <div class="axis"><span>0時</span><span>6時</span><span>12時</span><span>18時</span><span>24時</span></div>
    <div class="tot"><span class="lab">この日の合計</span><span class="val" id="dayTotal">--<small>kWh</small></span></div>
    <div class="note" id="note"></div>
  </div>

  <div class="card" id="csvCard" hidden>
    <h2>CSV で書き出す</h2>
    <div class="csv">
      <span class="lab">30分ごと</span>
      <button data-kind="halfhour" data-scope="month">この月</button>
      <button data-kind="halfhour" data-scope="all">すべて</button>
      <span class="lab">1分ごと</span>
      <button data-kind="minute" data-scope="month">この月</button>
      <button data-kind="minute" data-scope="all">すべて</button>
    </div>
    <div class="note">保存先は次の画面で選びます。1分ごとの記録はこの端末に90日まで残ります。</div>
  </div>

  <div class="card" id="emptyCard" hidden>
    <div class="empty">
      まだ履歴がありません。<br>
      家の Wi-Fi に入って「今すぐ同期」を実行してください。
    </div>
  </div>

  <footer id="foot"></footer>
</div>

<script>
function api(name, arg) {
  try {
    return JSON.parse(arg === undefined ? Meter[name]() : Meter[name](arg));
  } catch (e) {
    return null;
  }
}

function ago(ms) {
  if (!ms) return "まだ一度も同期していません";
  var s = Math.floor((Date.now() - ms) / 1000);
  if (s < 90) return "さきほど同期";
  if (s < 3600) return Math.floor(s / 60) + "分前に同期";
  if (s < 86400) return Math.floor(s / 3600) + "時間前に同期";
  return Math.floor(s / 86400) + "日前に同期";
}

function fmt(v, d) {
  if (v === null || v === undefined || isNaN(v)) return "--";
  return Number(v).toFixed(d === undefined ? 1 : d);
}

function css(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

var months = [];      // [{month:"2026-10", total_kwh, days, complete}], newest first
var monthDays = [];   // the shown month's days, oldest first
var year = null;      // the year the month grid shows
var month = null;     // "2026-10"
var selected = null;  // "2026-10-24"

/**
 * Both series on one axis in watts.
 *
 * A half-hour slot's kWh is the same quantity as instantaneous power, just
 * averaged: kWh per 30 min x 2000 is the mean watts over that slot. Plotting
 * the bars in watts is what makes the minute line sit honestly on top of
 * them instead of next to an unrelated scale.
 */
function draw(use, samples, midnight) {
  var c = document.getElementById("chart");
  var dpr = window.devicePixelRatio || 1;
  var W = Math.round(c.clientWidth * dpr);
  var H = Math.round(c.clientHeight * dpr);
  c.width = W; c.height = H;
  var ctx = c.getContext("2d");
  ctx.clearRect(0, 0, W, H);

  var pad = 6 * dpr;
  var plotH = H - pad * 2;

  var barW = use.map(function (v) { return v === null || v === undefined ? null : v * 2000; });
  var vals = barW.filter(function (v) { return v !== null; });
  var lineW = samples.map(function (s) { return s[1]; }).filter(function (v) { return v !== null; });
  var max = Math.max.apply(null, vals.concat(lineW).concat([1]));
  max = max * 1.12;

  function X(sec) { return (sec / 86400) * W; }
  function Y(w) { return pad + plotH - (w / max) * plotH; }

  ctx.strokeStyle = css("--grid");
  ctx.lineWidth = 1 * dpr;
  for (var g = 0; g <= 2; g++) {
    var y = pad + plotH * g / 2;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }

  // 30-minute averages, behind
  ctx.fillStyle = css("--s1");
  ctx.globalAlpha = 0.35;
  for (var i = 0; i < 48; i++) {
    if (barW[i] === null) continue;
    var x0 = X(i * 1800) + 0.5 * dpr;
    var x1 = X((i + 1) * 1800) - 0.5 * dpr;
    var y0 = Y(barW[i]);
    ctx.fillRect(x0, y0, Math.max(1, x1 - x0), pad + plotH - y0);
  }
  ctx.globalAlpha = 1;

  // Per-minute, in front. Broken into runs so a gap in the record shows as
  // a gap rather than a straight line across it.
  if (samples.length > 1) {
    ctx.strokeStyle = css("--s1");
    ctx.lineWidth = 1.6 * dpr;
    ctx.lineJoin = "round"; ctx.lineCap = "round";
    ctx.beginPath();
    var open = false, prev = null;
    for (var k = 0; k < samples.length; k++) {
      var ts = samples[k][0], w = samples[k][1];
      if (w === null || w === undefined) { open = false; continue; }
      var sec = ts - midnight;
      if (sec < 0 || sec > 86400) { open = false; continue; }
      if (open && prev !== null && sec - prev > 300) open = false; // >5 min gap
      if (!open) { ctx.moveTo(X(sec), Y(w)); open = true; }
      else { ctx.lineTo(X(sec), Y(w)); }
      prev = sec;
    }
    ctx.stroke();
  }

  ctx.fillStyle = css("--muted");
  ctx.font = (11 * dpr) + "px -apple-system, sans-serif";
  ctx.fillText(Math.round(max / 1.12) + " W", 4 * dpr, 13 * dpr);
}

function pad2(n) { return (n < 10 ? "0" : "") + n; }

function monthEntry(m) {
  for (var i = 0; i < months.length; i++) if (months[i].month === m) return months[i];
  return null;
}

function years() {
  var out = [];
  months.forEach(function (m) {
    var y = +m.month.slice(0, 4);
    if (out.indexOf(y) < 0) out.push(y);
  });
  return out; // newest first, like months
}

function renderYear() {
  var ys = years();
  var i = ys.indexOf(year);
  var sum = 0;
  months.forEach(function (m) {
    if (+m.month.slice(0, 4) === year && m.total_kwh !== null) sum += m.total_kwh;
  });
  document.getElementById("yearLabel").innerHTML =
    year + "年<small>" + fmt(sum, 0) + " kWh</small>";
  // Newest first: the "previous" year is further along the list.
  var prev = document.getElementById("prevYear");
  var next = document.getElementById("nextYear");
  prev.disabled = i < 0 || i >= ys.length - 1;
  next.disabled = i <= 0;
  prev.onclick = function () { showYear(ys[i + 1]); };
  next.onclick = function () { showYear(ys[i - 1]); };

  var box = document.getElementById("months");
  box.innerHTML = "";
  for (var mo = 1; mo <= 12; mo++) {
    var key = year + "-" + pad2(mo);
    var e = monthEntry(key);
    var b = document.createElement("button");
    b.className = "mon" + (key === month ? " sel" : "");
    b.disabled = !e;
    b.innerHTML = '<div class="m">' + mo + "月</div>"
      + '<div class="k">' + (e ? fmt(e.total_kwh, 0) : "&nbsp;") + "</div>";
    if (e) b.onclick = (function (k) { return function () { showMonth(k); }; })(key);
    box.appendChild(b);
  }
}

/** Jump to a year at its newest month that has data. */
function showYear(y) {
  for (var i = 0; i < months.length; i++) {
    if (+months[i].month.slice(0, 4) === y) { showMonth(months[i].month); return; }
  }
}

function showMonth(m) {
  month = m;
  year = +m.slice(0, 4);
  var r = api("daysInMonth", m);
  monthDays = (r && r.days) || [];
  renderYear();
  var keep = selected && selected.slice(0, 7) === m && dayEntry(selected);
  if (!keep) selected = monthDays.length ? monthDays[monthDays.length - 1].date : null;
  renderCalendar();
  if (selected) select(selected);
  else document.getElementById("dayCard").hidden = true;
}

function dayEntry(date) {
  for (var i = 0; i < monthDays.length; i++) if (monthDays[i].date === date) return monthDays[i];
  return null;
}

function renderCalendar() {
  var y = +month.slice(0, 4), mo = +month.slice(5, 7);
  var e = monthEntry(month);
  document.getElementById("monthTitle").textContent = y + "年" + mo + "月";
  document.getElementById("monthTotal").textContent =
    e ? "合計 " + fmt(e.total_kwh, 1) + " kWh ・ " + e.days + "日分" : "";

  var box = document.getElementById("cal");
  box.innerHTML = "";
  "日月火水木金土".split("").forEach(function (w) {
    var h = document.createElement("div");
    h.className = "wd"; h.textContent = w;
    box.appendChild(h);
  });
  var lead = new Date(y, mo - 1, 1).getDay();
  var last = new Date(y, mo, 0).getDate();
  for (var i = 0; i < lead; i++) {
    var blank = document.createElement("div");
    blank.className = "cell blank";
    box.appendChild(blank);
  }
  for (var d = 1; d <= last; d++) {
    var key = month + "-" + pad2(d);
    var de = dayEntry(key);
    var b = document.createElement("button");
    b.className = "cell" + (key === selected ? " sel" : "");
    b.disabled = !de;
    // A day still missing slots is shown greyed rather than labelled, to
    // keep the cell to one number; the day card says how much is there.
    b.innerHTML = '<div class="n">' + d + "</div>"
      + '<div class="k' + (de && !de.complete ? " part" : "") + '">'
      + (de ? fmt(de.total_kwh, 1) : "&nbsp;") + "</div>";
    if (de) b.onclick = (function (k) { return function () { select(k); }; })(key);
    box.appendChild(b);
  }
  document.getElementById("calCard").hidden = false;
}

function select(date) {
  selected = date;
  var d = api("day", date);
  var card = document.getElementById("dayCard");
  if (!d || !d.use_kwh) { card.hidden = true; renderCalendar(); return; }

  var mins = api("minutesForDate", date) || { samples: [] };
  var samples = mins.samples || [];

  var parts = date.split("-");
  var midnight = Math.floor(
    new Date(+parts[0], +parts[1] - 1, +parts[2], 0, 0, 0, 0).getTime() / 1000);

  card.hidden = false;
  draw(d.use_kwh, samples, midnight);

  var known = d.use_kwh.filter(function (v) { return v !== null; });
  var total = known.reduce(function (a, b) { return a + b; }, 0);
  var de = dayEntry(date);
  document.getElementById("dayTitle").textContent = date;
  document.getElementById("dayTotal").innerHTML = fmt(total, 1) + "<small>kWh</small>";
  document.getElementById("note").textContent = (samples.length
    ? "1分ごとの記録 " + samples.length + " 件"
    : "この日の1分ごとの記録はありません（Cube が保持する分だけ同期できます）")
    + (de && !de.complete ? "。30分ごとの値に欠けがあります" : "");

  renderCalendar();
}

function exportCsv(kind, scope) {
  if (typeof Meter === "undefined" || !Meter.exportCsv) return;
  Meter.exportCsv(kind, scope === "month" && month ? month : "");
}

(function () {
  var bs = document.querySelectorAll(".csv button");
  for (var i = 0; i < bs.length; i++) {
    bs[i].onclick = (function (b) {
      return function () { exportCsv(b.getAttribute("data-kind"), b.getAttribute("data-scope")); };
    })(bs[i]);
  }
})();

function load() {
  var st = api("status") || {};
  document.getElementById("status").textContent =
    ago(st.last_sync) + " ・ " + (st.days || 0) + "日分 / " + (st.minutes || 0) + "件";
  document.getElementById("foot").textContent =
    st.host ? "Cube " + st.host + " から取得" : "";

  var r = api("months");
  months = (r && r.months) || [];
  var has = months.length > 0;
  document.getElementById("emptyCard").hidden = has;
  document.getElementById("pickCard").hidden = !has;
  document.getElementById("csvCard").hidden = !has;
  if (has) showMonth(month && monthEntry(month) ? month : months[0].month);
}

window.addEventListener("resize", function () { if (selected) select(selected); });
load();
</script>
</body>
</html>
