name: Build APK

# The debug variant on purpose: it is signed with the standard debug key,
# so the artifact installs on a phone as-is. A release build would come out
# unsigned and refuse to install, which is not what anyone wants from a
# download link.

on:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write   # the release asset below

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # No --stacktrace: it buries "What went wrong" under a few hundred
      # frames, which is exactly the part worth reading from the API.
      # Restores the signing key when the repository has one. Without it
      # Gradle makes a throwaway key per run, every build carries a
      # different signature, and Android rejects the update as a package
      # conflict. ANDROID_KEYSTORE_PASSWORD may be left unset if the key
      # was made without one.
      # The secret arrives through env, not interpolated into the script:
      # `secrets` is not a value an `if` may read, and a secret pasted into
      # a run line would be one quoting mistake away from the log.
      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "no signing secret is set; this build falls back to a"
            echo "throwaway key and cannot update an existing install."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' \
            | base64 -d > android/app/cubej1.jks
          test -s android/app/cubej1.jks
          echo "signing key restored ($(stat -c%s android/app/cubej1.jks) bytes)"

      - name: Build
        env:
          CUBEJ1_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CUBEJ1_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CUBEJ1_KEY_ALIAS: cubej1
        working-directory: android
        run: |
          set -o pipefail
          gradle --no-daemon assembleDebug 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Show what failed
        if: failure()
        run: |
          echo "----- errors -----"
          grep -nE "error:|warning:|FAILURE:|What went wrong|Execution failed|^> |AAPT|\.java:[0-9]+|\.xml:[0-9]+" \
            "$RUNNER_TEMP/build.log" | head -80 || echo "(no matching lines)"
          echo "----- last 40 lines -----"
          tail -40 "$RUNNER_TEMP/build.log"

      - name: Which key signed it
        run: |
          APK=$(find android/app/build/outputs/apk/debug -name '*.apk' | head -1)
          if keytool -printcert -jarfile "$APK" 2>/dev/null | grep -m1 'SHA256:'; then
            :
          else
            echo "no v1 signature: this build used Gradle's throwaway debug key,"
            echo "so it cannot update an install signed by a different run."
          fi

      - name: Describe the APK
        run: |
          APK=$(find android/app/build/outputs/apk/debug -name '*.apk' | head -1)
          echo "apk: $APK ($(du -h "$APK" | cut -f1))"
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort | tail -1)
          "$AAPT" dump badging "$APK" | head -5

      - uses: actions/upload-artifact@v4
        with:
          name: cubej1-monitor-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # An artifact needs a login and arrives as a zip, which is awkward on
      # the phone that is meant to install it. A release asset is a plain
      # file on a stable URL that Chrome downloads and opens directly.
      # The tag is reused, so the link never changes; only the file behind
      # it does.
      - name: Publish the APK as a release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk cubej1-monitor.apk
          gh release view apk-latest >/dev/null 2>&1 || gh release create apk-latest \
            --target "$GITHUB_SHA" \
            --title "電力モニタ 最新ビルド" \
            --prerelease \
            --notes "Cube J1 のダッシュボードを全画面で開く Android アプリ。

            デバッグ署名なのでそのままインストールできます（提供元不明のアプリの許可は必要）。
            初回起動で Cube の IP を聞かれます。ブラウザのアドレスバーから URL ごと貼り付けても構いません。

            このリンクは固定で、ビルドのたびに中身が差し替わります。"
          gh release upload apk-latest cubej1-monitor.apk --clobber
          echo "APK: https://github.com/$GITHUB_REPOSITORY/releases/download/apk-latest/cubej1-monitor.apk"
